name: Sync with upstream Django

# Keeps each mongodb-X.Y.x fork branch in sync with upstream Django by rebasing
# and force-pushing (a rebased branch can't be advanced via a PR). A rebase that
# conflicts is aborted and reported as an issue for manual resolution.

on:
  schedule:
    - cron: '0 9 * * *'   # Daily 09:00 UTC
  workflow_dispatch:

env:
  UPSTREAM_URL: https://github.com/django/django.git
  BACKEND_REPO: mongodb/django-mongodb-backend

jobs:
  sync:
    name: ${{ matrix.local_branch }}
    runs-on: ubuntu-latest
    # Scopes in APP_ID and APP_PRIVATE_KEY for secure-checkout. No required
    # reviewers on it, or every daily run waits on a human.
    environment: automation
    if: github.repository_owner == 'mongodb-forks' || github.event_name == 'workflow_dispatch'
    # Don't cancel: an in-progress force-push must finish.
    concurrency:
      group: upstream-sync-${{ matrix.local_branch }}
      cancel-in-progress: false
    # issues: write is for the conflict issue, which uses GITHUB_TOKEN because
    # the secure-checkout App token has no issues scope.
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        # Maintained by hand. When Django cuts stable/X.Y.x, add the matching
        # mongodb-X.Y.x and repoint whichever branch was tracking main. When a
        # stable branch reaches EOL and upstream deletes it, drop that row, or
        # the job fails on a missing ref daily. Django supports the last two
        # feature releases plus any LTS (docs/internals/release-process.txt);
        # mongodb-5.0.x / mongodb-5.1.x are already gone upstream.
        #
        # ci_rerun says how to re-test whatever consumes this fork branch,
        # since a force-push alone tells it nothing. Kept identical to the
        # mapping the local sync tooling uses, so the two cannot drift: a
        # string is a backend branch to dispatch on, a number is a backend PR
        # whose runs re-queue, and {pr, evergreen} also retries its Evergreen
        # patch. Leave empty when nothing consumes the branch.
        include:
          # PR 602 supersedes 535 for the same head branch (django62).
          - local_branch: mongodb-6.2.x
            upstream_branch: main   # until Django cuts stable/6.2.x
            ci_rerun: '{"mongodb/django-mongodb-backend": {"pr": 602, "evergreen": true}}'
          - local_branch: mongodb-6.1.x
            upstream_branch: stable/6.1.x
            ci_rerun: '{"mongodb/django-mongodb-backend": "main"}'
          - local_branch: mongodb-6.0.x
            upstream_branch: stable/6.0.x
            ci_rerun: '{"mongodb/django-mongodb-backend": "6.0.x"}'
          # 622 (5.2.5 LTS backports) supersedes the closed 607.
          - local_branch: mongodb-5.2.x
            upstream_branch: stable/5.2.x   # LTS
            ci_rerun: '{"mongodb/django-mongodb-backend": {"pr": 622, "evergreen": true}}'

    steps:
      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # Mints an App token and checks out with it. The App needs contents:write.
      - name: Checkout ${{ matrix.local_branch }}
        uses: mongodb-labs/drivers-github-tools/secure-checkout@f137fdd28483af14ebf466ebc5aa789fbf867218  # v3.0.5
        with:
          app_id: ${{ vars.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}
          ref: ${{ matrix.local_branch }}
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM_URL"
          git fetch --no-tags upstream "${{ matrix.upstream_branch }}"

      - name: Rebase onto upstream/${{ matrix.upstream_branch }}
        id: rebase
        run: |
          set -euo pipefail
          BEFORE=$(git rev-parse HEAD)
          UPSTREAM_REF="upstream/${{ matrix.upstream_branch }}"

          if git rebase "$UPSTREAM_REF"; then
            AFTER=$(git rev-parse HEAD)
            if [ "$BEFORE" = "$AFTER" ]; then
              echo "status=unchanged" >> "$GITHUB_OUTPUT"
              echo "Already up to date with $UPSTREAM_REF."
            else
              # --no-merges to match the commit list built below.
              COUNT=$(git rev-list --count --no-merges "${BEFORE}..${UPSTREAM_REF}")
              echo "status=updated" >> "$GITHUB_OUTPUT"
              echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
              # Random delimiter so a commit subject can't terminate the block.
              DELIM="commits_EOF_${RANDOM}${RANDOM}"
              {
                echo "commits<<${DELIM}"
                git log --no-merges --pretty='- %h %s' "${BEFORE}..${UPSTREAM_REF}"
                echo "${DELIM}"
              } >> "$GITHUB_OUTPUT"
              echo "Rebased; ${COUNT} new upstream commit(s)."
            fi
          else
            git rebase --abort || true
            echo "status=conflict" >> "$GITHUB_OUTPUT"
            echo "Rebase hit conflicts."
          fi

      # --force-with-lease, not --force: a push that landed since checkout fails
      # the run instead of being silently discarded.
      - name: Force-push rebased ${{ matrix.local_branch }}
        id: push
        if: steps.rebase.outputs.status == 'updated'
        run: git push --force-with-lease origin "HEAD:${{ matrix.local_branch }}"

      # A rejected push needs the same manual queue as a conflict. GitHub
      # refuses workflow-file updates from an App without the workflows
      # permission, so an upstream commit that touches .github fails here
      # (INTPYTHON-1140). always() because GitHub prepends success() to an if
      # with no status function, which would skip this after the failed push.
      - name: Open push-rejected issue
        if: always() && steps.push.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Push rejected: ${{ matrix.local_branch }}"
        run: |
          set -euo pipefail
          # -R because gh infers the repo from the remotes and picks upstream
          # (django/django), which has issues disabled.
          EXISTING=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,title \
            --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "Push-rejected issue #$EXISTING already open."
          else
            BODY=$(printf 'Automated sync could not force-push the rebased `%s` back to `origin/%s` — manual resolution required.\n\nCommon cause: the App token has no `workflows` permission, so an upstream commit that touches `.github` is rejected.\n\nRun log: %s' \
              "${{ matrix.local_branch }}" "${{ matrix.local_branch }}" \
              "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
            gh issue create -R "$GITHUB_REPOSITORY" --title "$TITLE" \
              --body "$BODY"
          fi

      # Records what landed, so a branch that turns out to be broken can be
      # traced back to the commits that arrived.
      - name: Summarize the sync
        if: steps.rebase.outputs.status == 'updated'
        env:
          COUNT: ${{ steps.rebase.outputs.count }}
          COMMITS: ${{ steps.rebase.outputs.commits }}
        run: |
          set -euo pipefail
          {
            printf '### %s ← upstream/%s\n\n' \
              "${{ matrix.local_branch }}" "${{ matrix.upstream_branch }}"
            printf '%s new upstream commit(s):\n\n%s\n' "$COUNT" "$COMMITS"
          } >> "$GITHUB_STEP_SUMMARY"

      # The backend pins this branch at a ref, so a force-push changes what it
      # builds against. Nothing else would re-test it.
      - name: Re-trigger ${{ env.BACKEND_REPO }} CI
        if: steps.rebase.outputs.status == 'updated' && matrix.ci_rerun != ''
        uses: mongodb-labs/drivers-github-tools/retrigger-ci@a60e21f810ee878bfc99364b28bdbb946ab80c63  # v3.1.0
        with:
          ci_rerun: ${{ matrix.ci_rerun }}
          owner: mongodb
          repositories: django-mongodb-backend
          app_id: ${{ vars.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Open conflict issue
        if: steps.rebase.outputs.status == 'conflict'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Rebase conflict: ${{ matrix.local_branch }} onto upstream/${{ matrix.upstream_branch }}"
        run: |
          set -euo pipefail
          # -R because gh infers the repo from the remotes and picks upstream
          # (django/django), which has issues disabled.
          EXISTING=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,title \
            --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "Conflict issue #$EXISTING already open."
          else
            BODY=$(printf 'Automated sync could not rebase `%s` onto `upstream/%s` — manual resolution required.\n\nRun log: %s' \
              "${{ matrix.local_branch }}" "${{ matrix.upstream_branch }}" \
              "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
            gh issue create -R "$GITHUB_REPOSITORY" --title "$TITLE" \
              --body "$BODY"
          fi
